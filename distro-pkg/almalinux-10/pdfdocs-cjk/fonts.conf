<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
<!--
  Ignore variable-font glob (not to break xetex)
-->
    <selectfont>
        <rejectfont>
            <!--
                for RHEL 10 and its clones
            -->
            <glob>/usr/share/fonts/*-vf/*.ttf</glob>
        </rejectfont>
    </selectfont>
</fontconfig>
